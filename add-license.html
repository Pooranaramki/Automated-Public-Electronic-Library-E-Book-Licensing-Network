<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Issue / Update License</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 35px 40px; border-radius: 10px; width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-top: 0; margin-bottom: 25px; color: #1e293b; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; color: #334155; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; background-color: #16a34a; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #6366f1; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Issue E-Book License</h2>
    <form th:action="@{/license/save}" th:object="${bookLicense}" method="post">
        <div class="form-group">
            <label>License ID</label>
            <input type="number" th:field="*{licenseId}" required />
        </div>
        <div class="form-group">
            <label>Book Title</label>
            <input type="text" th:field="*{bookTitle}" required />
        </div>
        <div class="form-group">
            <label>Author</label>
            <input type="text" th:field="*{author}" required />
        </div>
        <div class="form-group">
            <label>Category</label>
            <input type="text" th:field="*{category}" placeholder="e.g. Technology, Science" required />
        </div>
        <div class="form-group">
            <label>Available Copies</label>
            <input type="number" th:field="*{availableCopies}" required />
        </div>
        <div class="form-group">
            <label>License Status</label>
            <select th:field="*{licenseStatus}">
                <option value="Active">Active</option>
                <option value="Renewed">Renewed</option>
                <option value="Expired">Expired</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Submit Details</button>
        <a th:href="@{/}" class="back-link">&larr; Back to Dashboard</a>
    </form>
</div>

</body>
</html>
